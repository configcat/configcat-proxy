<!doctype html>
<html lang="en">

<head>
    <title>ConfigCat Proxy API sample</title>
    <meta charset="utf-8">

    <script type="text/javascript">
        const url = "http://test-proxy.featureflagfalcon.com:8050/ofrep/v1/evaluate/flags";

        const data = {
            context: {
                targetingKey: "09c63c8ad682"
            }
        };

        const requestOptions = {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-ConfigCat-SdkKey': '8anZCJ-X7EiBaM_N8tIEJw/lbZyY8lmBUKV3BcM8HM5jA'
            },
            body: JSON.stringify(data),
        };

        fetch(url, requestOptions)
            .then(response => response.json())
            .then(data => console.log(data))
            .catch(error => console.error('Error:', error));
    </script>
</head>

<body>
Open Console (F12) to see the results!
</body>

</html>
